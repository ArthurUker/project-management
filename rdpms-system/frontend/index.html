<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📊</text></svg>">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="研发项目管理系统 - R&D Project Management System">
    <meta name="theme-color" content="#1a73e8">
    <title>研发项目管理系统 | R&D PMS</title>
  </head>
  <body>
    <div id="root"></div>

    <!-- 玻璃折射滤镜（Liquid Glass）：.glass / .card 的 backdrop-filter 通过
         url(#lg-refraction) 引用；必须常驻 DOM，且不可被 React 根节点回收。 -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="lg-refraction" x="-20%" y="-20%" width="140%" height="140%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.02" numOctaves="2" seed="7" result="noise" />
        <feGaussianBlur in="noise" stdDeviation="2" result="blurredNoise" />
        <feDisplacementMap in="SourceGraphic" in2="blurredNoise" scale="9" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
